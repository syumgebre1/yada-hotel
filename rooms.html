<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Rooms</title>
    <link rel="stylesheet" href="J.css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html" id="authLink">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="padding: 30px 20px;">
            <h1 style="font-size: 32px;">🛏️ Our Rooms</h1>
            <p>Choose from our selection of comfortable rooms.</p>
        </div>
        
        <div id="alertMessage"></div>
        <div id="roomContainer" class="room-grid"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';
        
        function checkAuth() {
            const user = localStorage.getItem('user');
            const authLink = document.getElementById('authLink');
            
            if (user) {
                authLink.textContent = 'Logout';
                authLink.href = '#';
                authLink.onclick = function(e) {
                    e.preventDefault();
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                };
            } else {
                authLink.textContent = 'Login';
                authLink.href = 'login.html';
                authLink.onclick = null;
            }
        }
        
        async function loadRooms() {
            try {
                console.log('📡 Fetching rooms from:', API_URL + '/rooms');
                
                const response = await fetch(`${API_URL}/rooms`);
                const rooms = await response.json();
                console.log('📋 Rooms loaded:', rooms.length);
                
                const container = document.getElementById('roomContainer');
                container.innerHTML = '';
                
                rooms.forEach(room => {
                    const statusClass = room.available ? 'available' : 'unavailable';
                    const statusText = room.available ? '✅ Available' : '❌ Occupied';
                    
                    const card = document.createElement('div');
                    card.className = 'room-card';
                    card.innerHTML = `
                        <h3>🛏️ Room ${room.room_number}</h3>
                        <p><span class="room-type">${room.room_type}</span></p>
                        <p><strong>Price:</strong> <span class="price">${room.price.toLocaleString()} ETB</span>/night</p>
                        <p>${room.description || 'Comfortable room for your stay'}</p>
                        <p class="${statusClass}"><strong>${statusText}</strong></p>
                        ${room.available ? 
                            `<a href="booking.html?room_id=${room.id}" class="btn btn-gold" style="width:100%; text-align:center; margin-top:10px;">Book Now</a>` :
                            `<button class="btn btn-danger" style="width:100%; margin-top:10px;" disabled>Not Available</button>`
                        }
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('❌ Error loading rooms:', error);
                showAlert('Failed to load rooms. Make sure the server is running.', 'error');
            }
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }
        
        checkAuth();
        loadRooms();
    </script>
</body>
</html>
