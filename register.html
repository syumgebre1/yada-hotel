<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Register</title>
    <link rel="stylesheet" href="J.css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="container">
        <div style="max-width: 400px; margin: 40px auto;">
            <div class="card">
                <h2 style="text-align: center; color: #1a1a2e;">📝 Register</h2>
                
                <div id="alertMessage"></div>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password" required minlength="6">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
                        Register
                    </button>
                </form>
                
                <p style="text-align: center; margin-top: 15px;">
                    Already have an account? <a href="login.html">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // ⭐⭐⭐ FIXED: Using 127.0.0.1 ⭐⭐⭐
        const API_URL = 'http://127.0.0.1:5000/api';
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showAlert('Passwords do not match!', 'error');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters!', 'error');
                return;
            }
            
            try {
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Registering...';
                submitBtn.disabled = true;
                
                console.log('📡 Sending to:', API_URL + '/register');
                
                const response = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                console.log('📊 Response:', response.status, data);
                
                if (response.ok) {
                    showAlert('✅ Registration successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1000);
                } else {
                    showAlert(data.error || '❌ Registration failed', 'error');
                    submitBtn.textContent = 'Register';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert('❌ Connection error. Make sure the server is running on port 5000', 'error');
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Register';
                submitBtn.disabled = false;
            }
        });
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }
        
        if (localStorage.getItem('user')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
