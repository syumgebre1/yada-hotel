<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <!-- ABSOLUTE PATH USED HERE -->
            <img src="/static/logo.png" alt="YADA HOTEL" style="height: 50px; width: 50px; object-fit: contain; border-radius: 8px;">
        </a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/login">Login</a>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>
    <div class="container">
        <div style="max-width: 400px; margin: 40px auto;">
            <div class="card">
                <h2 style="text-align: center; color: var(--card-title); margin-bottom: 20px;"><i class="fa-solid fa-lock"></i> Login</h2>
                <form id="loginForm">
                    <div class="form-group"><label for="username">Username</label><input type="text" id="username" required></div>
                    <div class="form-group"><label for="password">Password</label><input type="password" id="password" required></div>
                    <div style="text-align: right; margin-bottom: 15px;"><a href="/forgot-password" style="color: #2a5a8a; font-size: 14px;">Forgot Password?</a></div>
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px;">Login</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">Don't have an account? <a href="/register" style="color: #2a5a8a;">Register here</a></p>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark-mode"); }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }
        function showToast(message, isSuccess = true) {
            Toastify({ text: message, duration: 3000, close: true, gravity: "top", position: "right", style: { background: isSuccess ? "linear-gradient(to right, #00b09b, #96c93d)" : "linear-gradient(to right, #ff5f6d, #ffc371)" } }).showToast();
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ username, password }) });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('✅ Login successful! Redirecting...', true);
                    setTimeout(() => { if (data.user.username === 'admin') window.location.href = '/admin'; else window.location.href = '/dashboard'; }, 1000);
                } else { showToast(data.error || '❌ Login failed', false); }
            } catch (error) { showToast('❌ Connection error.', false); }
        });
    </script>
</body>
</html>
