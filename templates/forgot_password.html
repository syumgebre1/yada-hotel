<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YADA HOTEL - Forgot Password</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><img src="{{ url_for('static', filename='logo.png') }}" alt="YADA HOTEL" style="height: 45px; width: auto; object-fit: contain;"></a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <select class="lang-select" id="langToggle" onchange="changeLanguage(this.value)" style="background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px; border-radius: 5px; margin-right: 10px; cursor: pointer;"><option value="en" style="color:black;">EN</option><option value="am" style="color:black;">አማ</option></select>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <div style="max-width: 400px; margin: 60px auto;">
            <div class="card">
                <h2 style="text-align: center; color: var(--card-title); margin-bottom: 20px;"><i class="fa-solid fa-key"></i> Forgot Password</h2>
                <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Enter your email address and we'll send you a link to reset your password.</p>
                <form id="forgotForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px;">Send Reset Link</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">
                    Remembered it? <a href="/login" style="color: #2a5a8a;">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark-mode"); }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }
        window.addEventListener("DOMContentLoaded", () => {
            const icon = document.querySelector("#themeBtn i");
            if(icon && document.body.classList.contains("dark-mode")) icon.className = "fa-solid fa-sun";
        });

        function showToast(msg, isSuccess = true) {
            Toastify({ text: msg, duration: 3000, close: true, gravity: "top", position: "right", style: { background: isSuccess ? "linear-gradient(to right, #00b09b, #96c93d)" : "linear-gradient(to right, #ff5f6d, #ffc371)" } }).showToast();
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                showToast(data.message, true);
                document.getElementById('forgotForm').reset();
            } catch(e) { showToast('Connection error', false); }
        });
    </script>
</body>
</html>
