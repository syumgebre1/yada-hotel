<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Forgot Password - YADA Hotel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 40px; border-radius: 15px; width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #333; }
        .logo { max-width: 80px; margin-bottom: 20px; }
        h2 { margin-bottom: 10px; font-weight: 600; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; box-sizing: border-box; background: #2a2a2a; color: white; font-size: 16px; }
        input:focus { outline: none; border-color: #ffd700; }
        button { background: #ffd700; color: black; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; transition: 0.3s; }
        button:hover { background: #e6c200; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; }
        .msg.success { background: #1b4d2e; color: #4caf50; display: block; }
        .msg.error { background: #4d1b1b; color: #ff4c4c; display: block; }
        .back-link { margin-top: 20px; display: block; color: #888; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #ffd700; }
    </style>
</head>
<body>
    <div class="box">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="YADA Hotel" class="logo">
        <h2>Forgot Password?</h2>
        <p class="subtitle">Enter your email and we'll send you a reset link.</p>
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Your email address" required>
            <button type="submit" id="submitBtn">Send Reset Link</button>
        </form>
        <div id="msg" class="msg"></div>
        <a href="/login" class="back-link">← Back to Login</a>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value;
            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.className = 'msg success';
                    msg.textContent = '✅ ' + (data.message || 'Check your email for a reset link.');
                } else {
                    msg.className = 'msg error';
                    msg.textContent = '❌ ' + (data.error || 'Something went wrong.');
                    btn.disabled = false;
                    btn.textContent = 'Send Reset Link';
                }
            } catch(e) {
                msg.className = 'msg error';
                msg.textContent = '❌ Connection error.';
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
