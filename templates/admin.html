<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Admin Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 30px; }
        .admin-header h1 { font-family: 'Playfair Display', serif; color: var(--card-title); font-size: 32px; }
        .admin-header .logout-btn { background: #e74c3c; color: white; padding: 10px 25px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-left: 4px solid #2a5a8a; }
        .stat-card .number { font-size: 32px; font-weight: 700; color: #2a5a8a; }
        .stat-card .label { color: var(--text-muted); font-size: 14px; font-weight: 500; }
        .stat-card.revenue { border-left-color: #27ae60; }
        .stat-card.booking { border-left-color: #f39c12; }
        .stat-card.guest { border-left-color: #8e44ad; }
        .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .tab-btn { padding: 10px 25px; border: none; border-radius: 8px; background: var(--border-color); color: var(--text-color); cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .tab-btn.active { background: #2a5a8a; color: white; }
        .tab-content { display: none; background: var(--card-bg); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: #1a3a5c; color: white; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-available { background: #d4edda; color: #155724; }
        .badge-occupied { background: #f8d7da; color: #721c24; }
        .btn-sm { padding: 5px 15px; font-size: 12px; border-radius: 5px; border: none; cursor: pointer; margin: 2px; }
        .btn-edit { background: #2a5a8a; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-add { background: #27ae60; color: white; padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--input-text); }
        .chart-container { background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
        #calendar { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        body.dark-mode #calendar { background: #1e1e1e; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><img src="{{ url_for('static', filename='logo.png') }}" alt="YADA HOTEL" style="height: 45px; width: auto; object-fit: contain;"></a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/restaurant">Restaurant</a>
            <a href="/admin" style="background: #2a5a8a; color: white; border-radius: 25px;"><i class="fa-solid fa-user-tie"></i> Admin</a>
            <a href="#" id="logoutLink">Logout</a>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fa-solid fa-user-tie"></i> Admin Dashboard</h1>
            <button class="logout-btn" id="logoutBtn"><i class="fa-solid fa-door-open"></i> Logout</button>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="number" id="totalRooms">-</div><div class="label">Total Rooms</div></div>
            <div class="stat-card"><div class="number" id="availableRooms">-</div><div class="label">Available</div></div>
            <div class="stat-card booking"><div class="number" id="totalBookings">-</div><div class="label">Total Bookings</div></div>
            <div class="stat-card revenue"><div class="number" id="totalRevenue">-</div><div class="label">Revenue (ETB)</div></div>
            <div class="stat-card guest"><div class="number" id="totalGuests">-</div><div class="label">Total Guests</div></div>
        </div>

        <div class="chart-container">
            <h3 style="margin-bottom: 15px; color: var(--card-title);"><i class="fa-solid fa-chart-line"></i> Revenue (Last 7 Days)</h3>
            <canvas id="revenueChart" style="max-height: 300px;"></canvas>
        </div>
        
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('rooms')"><i class="fa-solid fa-bed"></i> Rooms</button>
            <button class="tab-btn" onclick="switchTab('bookings')"><i class="fa-regular fa-calendar"></i> Bookings</button>
            <button class="tab-btn" onclick="switchTab('calendar')"><i class="fa-solid fa-calendar-days"></i> Calendar</button>
            <button class="tab-btn" onclick="switchTab('restaurant')"><i class="fa-solid fa-utensils"></i> Menu</button>
            <button class="tab-btn" onclick="switchTab('foodorders')"><i class="fa-solid fa-bell-concierge"></i> Food Orders</button>
            <!-- NEW: Table Reservations -->
            <button class="tab-btn" onclick="switchTab('tableres')"><i class="fa-solid fa-chair"></i> Table Bookings</button>
            <button class="tab-btn" onclick="switchTab('reviews')"><i class="fa-solid fa-star"></i> Reviews</button>
            <button class="tab-btn" onclick="switchTab('guests')"><i class="fa-solid fa-users"></i> Guests</button>
            <button class="tab-btn" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i> Settings</button>
        </div>
        
        <!-- ... (Rooms, Bookings, Calendar, Restaurant tabs remain the same as previous step) ... -->
        
        <!-- FOOD ORDERS TAB -->
        <div class="tab-content" id="tab-foodorders">
            <table>
                <thead><tr><th>Order</th><th>Customer</th><th>Room</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="foodOrdersTableBody"></tbody>
            </table>
        </div>

        <!-- NEW: TABLE RESERVATIONS TAB -->
        <div class="tab-content" id="tab-tableres">
            <table>
                <thead><tr><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="tableResTableBody"></tbody>
            </table>
        </div>
        
        <!-- ... (Reviews, Guests, Settings remain the same) ... -->
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        // ... (Existing functions like loadStats, loadChart, loadRooms remain the same) ...

        // NEW: LOAD FOOD ORDERS WITH TICKET BUTTON
        async function loadFoodOrders() {
            const res = await fetch(`${API_URL}/admin/food-orders`, { credentials: 'include' });
            if (!res.ok) return;
            const orders = await res.json();
            const tbody = document.getElementById('foodOrdersTableBody');
            tbody.innerHTML = '';
            orders.forEach(o => {
                const itemsParsed = JSON.parse(o.items).map(i => `${i.qty}x ${i.name}`).join(', ');
                let statusBadge = 'badge-pending';
                if(o.status === 'preparing') statusBadge = 'badge-available';
                if(o.status === 'delivered') statusBadge = 'badge-occupied';

                tbody.innerHTML += `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.user}</td>
                        <td>${o.room ? `<strong>Room ${o.room}</strong>` : 'Takeaway'}</td>
                        <td>${itemsParsed}</td>
                        <td>${o.total.toLocaleString()} ETB</td>
                        <td><span class="badge ${statusBadge}">${o.status.toUpperCase()}</span></td>
                        <td>
                            <select onchange="updateOrderStatus(${o.id}, this.value)" style="padding: 5px; border-radius: 5px; margin-bottom: 5px;">
                                <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="preparing" ${o.status === 'preparing' ? 'selected' : ''}>Preparing</option>
                                <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            </select>
                            <br>
                            <a href="/api/admin/food-orders/${o.id}/ticket" target="_blank" class="btn-sm btn-edit" style="text-decoration:none;"><i class="fa-solid fa-print"></i> Print Ticket</a>
                        </td>
                    </tr>`;
            });
        }

        // NEW: LOAD TABLE RESERVATIONS
        async function loadTableReservations() {
            const res = await fetch(`${API_URL}/admin/table-reservations`, { credentials: 'include' });
            if (!res.ok) return;
            const reservations = await res.json();
            const tbody = document.getElementById('tableResTableBody');
            tbody.innerHTML = '';
            reservations.forEach(r => {
                tbody.innerHTML += `
                    <tr>
                        <td>${r.name}</td>
                        <td>${r.phone}</td>
                        <td>${r.date}</td>
                        <td>${r.time}</td>
                        <td>${r.guests}</td>
                        <td><span class="badge ${r.status === 'confirmed' ? 'badge-available' : 'badge-pending'}">${r.status.toUpperCase()}</span></td>
                        <td>
                            <select onchange="updateResStatus(${r.id}, this.value)" style="padding: 5px; border-radius: 5px;">
                                <option value="pending" ${r.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${r.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            </select>
                        </td>
                    </tr>`;
            });
        }

        async function updateResStatus(id, status) {
            await fetch(`${API_URL}/admin/table-reservations/${id}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                body: JSON.stringify({ status })
            });
            showToast('Reservation status updated!');
        }

        // Update switchTab function to include new tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
            
            if (tab === 'rooms') loadRooms();
            else if (tab === 'bookings') loadBookings();
            else if (tab === 'calendar') loadCalendar();
            else if (tab === 'restaurant') loadMenu();
            else if (tab === 'foodorders') loadFoodOrders();
            else if (tab === 'tableres') loadTableReservations(); // NEW
            else if (tab === 'reviews') loadReviews();
            else if (tab === 'guests') loadGuests();
            else if (tab === 'settings') loadSettings();
        }

        checkAuth(); loadStats(); loadChart(); loadRooms();
    </script>
</body>
</html>
