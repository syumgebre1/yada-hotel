<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YADA HOTEL - Contact Us</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><i class="fa-solid fa-hotel"></i> YADA HOTEL</a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/restaurant">Restaurant</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/contact">Contact Us</a>
            <a href="/login" id="authLink">Login</a>
            <select class="lang-select" id="langToggle" onchange="changeLanguage(this.value)" style="background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px; border-radius: 5px; margin-right: 10px; cursor: pointer;"><option value="en" style="color:black;">EN</option><option value="am" style="color:black;">አማ</option></select>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="padding: 30px 20px;">
            <h1 style="font-size: 32px;"><i class="fa-solid fa-envelope"></i> Contact Us</h1>
            <p>We'd love to hear from you. Send us a message!</p>
        </div>

        <div style="max-width: 600px; margin: 0 auto;">
            <div class="card">
                <form id="contactForm">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-gold" style="width: 100%;"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark-mode"); }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        function showToast(msg, isSuccess = true) {
            Toastify({ text: msg, duration: 3000, close: true, gravity: "top", position: "right", style: { background: isSuccess ? "linear-gradient(to right, #00b09b, #96c93d)" : "linear-gradient(to right, #ff5f6d, #ffc371)" } }).showToast();
        }

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            try {
                const res = await fetch('/api/contact', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, message })
                });
                if (res.ok) {
                    showToast('✅ Message sent successfully!', true);
                    document.getElementById('contactForm').reset();
                } else {
                    showToast('❌ Failed to send message.', false);
                }
            } catch(e) { showToast('❌ Connection error', false); }
        });
    </script>
</body>
</html>
