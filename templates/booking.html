<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>YADA HOTEL - Book a Room</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <!-- NEW: GLOBAL LOADER -->
    <div id="global-loader">
        <div class="spinner"></div>
        <div class="loader-text">Processing your booking...</div>
    </div>

    <nav class="navbar">
        <a href="/" class="navbar-brand"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="YADA HOTEL" style="height: 45px; width: auto; object-fit: contain;"></a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/restaurant">Restaurant</a>
            <a href="/contact">Contact Us</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/login" id="authLink">Login</a>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <div style="max-width: 600px; margin: 40px auto;">
            <div class="card">
                <h2 style="text-align: center; color: var(--card-title); margin-bottom: 20px;"><i class="fa-regular fa-calendar-check"></i> Complete Your Booking</h2>
                <form id="bookingForm">
                    <input type="hidden" id="roomId" name="room_id">
                    <div class="form-group"><label>Full Name</label><input type="text" id="guestName" required></div>
                    <div class="form-group"><label>Phone Number</label><input type="tel" id="guestPhone" required></div>
                    <div class="form-group"><label>Check-in Date</label><input type="date" id="checkIn" required></div>
                    <div class="form-group"><label>Check-out Date</label><input type="date" id="checkOut" required></div>
                    <div style="background: var(--border-color); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center;">
                        <strong>Total Price: </strong><span id="totalPriceDisplay" style="font-size: 24px; color: #2a5a8a; font-weight: 700;">0 ETB</span>
                    </div>
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 15px; font-size: 18px;">Confirm Booking</button>
                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark-mode"); }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }
        function showToast(message, isSuccess = true) {
            Toastify({ text: message, duration: 3000, close: true, gravity: "top", position: "right", style: { background: isSuccess ? "linear-gradient(to right, #00b09b, #96c93d)" : "linear-gradient(to right, #ff5f6d, #ffc371)" } }).showToast();
        }
        
        function checkAuth() {
            const user = localStorage.getItem('user');
            const authLink = document.getElementById('authLink');
            if (user) {
                authLink.textContent = 'Logout'; authLink.href = '#';
                authLink.onclick = function(e) { e.preventDefault(); localStorage.removeItem('user'); window.location.href = '/login'; };
            } else {
                showToast('Please login first to book a room.', false);
                setTimeout(() => window.location.href = '/login', 1500);
            }
        }

        const API_URL = '/api';
        let roomPrice = 0;
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room_id');
        if (!roomId) {
            showToast('No room selected. Redirecting...', false);
            setTimeout(() => window.location.href = '/rooms', 1500);
        } else {
            document.getElementById('roomId').value = roomId;
            fetch(`${API_URL}/rooms/${roomId}`)
                .then(response => response.json())
                .then(room => {
                    roomPrice = room.price;
                    const today = new Date().toISOString().split('T')[0];
                    document.getElementById('checkIn').min = today;
                    document.getElementById('checkOut').min = today;
                })
                .catch(error => showToast('Could not load room details.', false));
        }

        function calculateTotal() {
            const checkIn = new Date(document.getElementById('checkIn').value);
            const checkOut = new Date(document.getElementById('checkOut').value);
            if (checkIn && checkOut && checkOut > checkIn) {
                const nights = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));
                document.getElementById('totalPriceDisplay').textContent = `${(nights * roomPrice).toLocaleString()} ETB (${nights} night${nights > 1 ? 's' : ''})`;
            } else {
                document.getElementById('totalPriceDisplay').textContent = '0 ETB';
            }
        }
        document.getElementById('checkIn').addEventListener('change', calculateTotal);
        document.getElementById('checkOut').addEventListener('change', calculateTotal);

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loader = document.getElementById('global-loader');
            loader.classList.add('active'); // SHOW LOADER

            const formData = {
                room_id: document.getElementById('roomId').value,
                guest_name: document.getElementById('guestName').value,
                guest_phone: document.getElementById('guestPhone').value,
                check_in: document.getElementById('checkIn').value,
                check_out: document.getElementById('checkOut').value
            };

            try {
                const response = await fetch(`${API_URL}/bookings`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content }, credentials: 'include',
                    body: JSON.stringify(formData)
                });
                const data = await response.json();
                if (response.ok) {
                    showToast(`✅ ${data.message} Total: ${data.total_price} ETB`, true);
                    setTimeout(() => { window.location.href = '/dashboard'; }, 2000);
                } else {
                    showToast(`❌ ${data.error || 'Booking failed'}`, false);
                    loader.classList.remove('active'); // HIDE LOADER ON ERROR
                }
            } catch (error) {
                showToast('❌ Connection error.', false);
                loader.classList.remove('active');
            }
        });

        checkAuth();
    </script>
    {% include '_syum_footer.html' %}
</body>
</html>
