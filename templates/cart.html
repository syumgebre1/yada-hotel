<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Order Cart</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="J.css/style.css">
    <style>
        .cart-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid #f0f0f0;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .cart-item-emoji {
            font-size: 40px;
            background: #f8f4e8;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-item-name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .cart-item-price {
            color: #7f8c8d;
            font-size: 14px;
        }
        .cart-total {
            font-size: 28px;
            font-weight: 700;
            color: #e6b800;
            text-align: right;
            padding: 20px 0;
            border-top: 3px solid #e6b800;
        }
        .empty-cart {
            text-align: center;
            padding: 80px 20px;
            color: #7f8c8d;
        }
        .empty-cart .big-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
        }
        .empty-cart h3 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin-bottom: 15px;
            color: #1a1a2e;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .quantity-control button {
            padding: 5px 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-minus {
            background: #f8d7da;
            color: #721c24;
        }
        .btn-minus:hover {
            background: #f5c6cb;
        }
        .btn-plus {
            background: #d4edda;
            color: #155724;
        }
        .btn-plus:hover {
            background: #c3e6cb;
        }
        .btn-remove {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s;
        }
        .btn-remove:hover {
            transform: scale(1.2);
        }
        .cart-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .cart-actions .btn {
            flex: 1;
            text-align: center;
            min-width: 120px;
            padding: 14px 20px;
            font-size: 16px;
        }
        .order-summary-box {
            background: #f8f4e8;
            padding: 25px;
            border-radius: 16px;
            margin-top: 20px;
        }
        .order-summary-box h3 {
            font-family: 'Playfair Display', serif;
            color: #1a1a2e;
            margin-bottom: 15px;
        }
        .order-summary-box .total {
            font-size: 24px;
            font-weight: 700;
            color: #e6b800;
        }
        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .cart-item-info {
                width: 100%;
            }
            .quantity-control {
                margin-left: auto;
            }
            .cart-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" id="authLink">Login</a>
        </div>
    </nav>

    <div class="container cart-container">
        <div class="hero" style="padding: 30px 20px;">
            <h1 style="font-size: 32px;">🍽️ Order Cart</h1>
            <p>Review your food and drink orders from YADA Restaurant</p>
        </div>
        <div id="cartItems"></div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        function checkAuth() {
            const user = localStorage.getItem('user');
            const authLink = document.getElementById('authLink');
            
            if (user) {
                authLink.textContent = 'Logout';
                authLink.href = '#';
                authLink.onclick = function(e) {
                    e.preventDefault();
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                };
            } else {
                authLink.textContent = 'Login';
                authLink.href = 'login.html';
                authLink.onclick = null;
            }
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <span class="big-icon">🍽️</span>
                        <h3>Your Order Cart is Empty</h3>
                        <p>Browse our menu and add some delicious food or drinks!</p>
                        <br>
                        <a href="menu.html" class="btn btn-gold" style="padding: 14px 40px;">📋 View Menu</a>
                    </div>
                `;
                return;
            }

            let html = '<div class="order-summary-box"><h3>📋 Your Order</h3>';
            let total = 0;
            
            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-emoji">${item.emoji}</div>
                            <div>
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">${item.price} ETB × ${item.quantity}</div>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="quantity-control">
                                <button class="btn-minus" onclick="updateQuantity(${index}, -1)">−</button>
                                <span style="font-size: 18px; min-width: 30px; text-align: center; font-weight: 600;">${item.quantity}</span>
                                <button class="btn-plus" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                            <button class="btn-remove" onclick="removeItem(${index})">✕</button>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="cart-total">💰 Total: ${total} ETB</div>
                <div class="cart-actions">
                    <a href="menu.html" class="btn btn-primary">📋 Continue Shopping</a>
                    <button onclick="clearCart()" class="btn btn-danger">🗑️ Clear Order</button>
                    <button onclick="placeOrder()" class="btn btn-gold" style="flex: 2;">✅ Place Order</button>
                </div>
            </div>`;
            
            container.innerHTML = html;
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (confirm('Clear your entire order?')) {
                cart = [];
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function placeOrder() {
            const user = localStorage.getItem('user');
            if (!user) {
                alert('Please login first to place an order.');
                window.location.href = 'login.html';
                return;
            }

            const orderText = cart.map(item => `${item.emoji} ${item.name} × ${item.quantity}`).join('\n');
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            alert(`📦 Order Placed!\n\n${orderText}\n\n💰 Total: ${total} ETB\n\nThank you for ordering at YADA Hotel!`);
            
            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        checkAuth();
        renderCart();
    </script>

        // Dark Mode Logic
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
        }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

    </script>
</body>
</html>
