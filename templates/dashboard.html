<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - My Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-top: 20px; }
        .sidebar { background: var(--card-bg); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: fit-content; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu button { width: 100%; text-align: left; padding: 12px 15px; border: none; background: transparent; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; color: var(--text-color); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .sidebar-menu button:hover { background: rgba(0,0,0,0.05); }
        body.dark-mode .sidebar-menu button:hover { background: rgba(255,255,255,0.05); }
        .sidebar-menu button.active { background: #1a3a5c; color: white; }
        .dashboard-content { background: var(--card-bg); border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .review-form { margin-top: 15px; background: rgba(0,0,0,0.02); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        body.dark-mode .review-form { background: rgba(255,255,255,0.02); }
        @media (max-width: 768px) { .dashboard-layout { grid-template-columns: 1fr; } .sidebar { display: flex; overflow-x: auto; padding: 10px; } .sidebar-menu { display: flex; gap: 10px; } .sidebar-menu button { white-space: nowrap; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><i class="fa-solid fa-hotel"></i> YADA HOTEL</a>
        <div class="navbar-links">
            <a href="/" data-i18n="home">Home</a>
            <a href="/rooms" data-i18n="rooms">Rooms</a>
            <a href="/restaurant" data-i18n="restaurant">Restaurant</a>
            <a href="/dashboard" data-i18n="dashboard">Dashboard</a>
            <a href="/contact" data-i18n="contact">Contact Us</a>
            <a href="/admin" id="adminNavBtn" style="display:none; background: #e6b800; color: #1a3a5c; font-weight: bold; padding: 5px 15px; border-radius: 20px;"><i class="fa-solid fa-user-tie"></i> Admin Panel</a>
            <a href="#" id="authLink" data-i18n="logout">Logout</a>
            <select class="lang-select" id="langToggle" onchange="changeLanguage(this.value)" style="background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px; border-radius: 5px; margin-right: 10px; cursor: pointer;"><option value="en" style="color:black;">EN</option><option value="am" style="color:black;">አማ</option></select>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="padding: 30px 20px; margin-bottom: 10px;">
            <h1 style="font-size: 32px;"><span data-i18n="welcome">Welcome back</span>, <span id="usernameDisplay">Guest</span>!</h1>
            <p data-i18n="dash_desc">Manage your bookings, profile, and more from your personal dashboard.</p>
        </div>

        <div class="dashboard-layout">
            <div class="sidebar">
                <ul class="sidebar-menu">
                    <li><button class="active" onclick="switchTab('bookings', this)"><i class="fa-solid fa-calendar-days"></i> <span data-i18n="my_bookings">My Bookings</span></button></li>
                    <li><button onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i> <span data-i18n="profile_settings">Profile Settings</span></button></li>
                    <li><button onclick="switchTab('security', this)"><i class="fa-solid fa-lock"></i> <span data-i18n="security">Security</span></button></li>
                </ul>
            </div>

            <div class="dashboard-content">
                <div id="tab-bookings" class="tab-section active">
                    <h2 style="margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;" data-i18n="my_bookings">📅 My Bookings</h2>
                    <div id="bookingsContainer">
                        <p style="text-align: center; color: var(--text-muted);" data-i18n="loading_bookings">Loading your bookings...</p>
                    </div>
                </div>

                <div id="tab-profile" class="tab-section">
                    <h2 style="margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;" data-i18n="profile_settings">👤 Update Profile</h2>
                    <form id="profileForm" style="max-width: 500px;">
                        <div class="form-group">
                            <label data-i18n="email">Email Address</label>
                            <input type="email" id="profileEmail" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="phone">Phone Number</label>
                            <input type="tel" id="profilePhone" placeholder="e.g. +251 912 345 678">
                        </div>
                        <button type="submit" class="btn btn-gold" style="width: 100%;" data-i18n="save_profile">Save Profile</button>
                    </form>
                </div>

                <div id="tab-security" class="tab-section">
                    <h2 style="margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;" data-i18n="security">🔒 Change Password</h2>
                    <form id="passwordForm" style="max-width: 500px;">
                        <div class="form-group">
                            <label data-i18n="current_pass">Current Password</label>
                            <input type="password" id="currentPassword" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="new_pass">New Password</label>
                            <input type="password" id="newPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="update_pass">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <a href="https://wa.me/251911122112?text=Hello%20YADA%20Hotel,%20I%20have%20a%20question." class="whatsapp-float" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        // Translation Logic
        const translations = {
            en: { home: "Home", rooms: "Rooms", dashboard: "Dashboard", contact: "Contact Us", login: "Login", logout: "Logout", welcome: "Welcome back", dash_desc: "Manage your bookings, profile, and more from your personal dashboard.", my_bookings: "My Bookings", profile_settings: "Profile Settings", security: "Security", email: "Email Address", phone: "Phone Number", save_profile: "Save Profile", current_pass: "Current Password", new_pass: "New Password", update_pass: "Update Password", cancel: "Cancel", leave_review: "Leave Review" },
            am: { home: "መነሻ", rooms: "ክፍሎች", dashboard: "ዳሽቦርድ", contact: "አግኙን", login: "ግባ", logout: "ውጣ", welcome: "እንኳን ደህና መጡ", dash_desc: "የእርስዎን ቦታ ማስያዝ፣ መገለጫ እና ሌሎችንም ከግል ዳሽቦርድዎ ያስተዳድሩ።", my_bookings: "የእኔ ቦታ ማስያዞች", profile_settings: "የመገለጫ ቅንብሮች", security: "ደህንነት", email: "ኢሜይል አድራሻ", phone: "ስልክ ቁጥር", save_profile: "መገለጫ አስቀምጥ", current_pass: "የአሁኑ የይለፍ ቃል", new_pass: "አዲስ የይለፍ ቃል", update_pass: "የይለፍ ቃል አዘምን", cancel: "ሰርዝ", leave_review: "አስተያየት ይስጡ" }
        };
        let currentLang = localStorage.getItem('language') || 'en';

        function changeLanguage(lang) {
            localStorage.setItem('language', lang);
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            const authLink = document.getElementById('authLink');
            if(authLink) authLink.textContent = translations[lang].logout;
            loadBookings(); // Reload bookings to update dynamic text inside
        }

        const langSelector = document.getElementById('langToggle');
        if(langSelector) { langSelector.value = currentLang; if(currentLang !== 'en') changeLanguage(currentLang); }

        // Dark Mode Logic
        if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark-mode"); }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        function showToast(message, isSuccess = true) {
            Toastify({ text: message, duration: 3000, close: true, gravity: "top", position: "right", style: { background: isSuccess ? "linear-gradient(to right, #00b09b, #96c93d)" : "linear-gradient(to right, #ff5f6d, #ffc371)" } }).showToast();
        }

        const API_URL = '/api';
        let currentUserBookings = [];
        
        function checkAuth() {
            const userStr = localStorage.getItem('user');
            if (!userStr) { window.location.href = '/login'; return; }
            try {
                const user = JSON.parse(userStr);
                document.getElementById('usernameDisplay').textContent = user.username;
                const adminBtn = document.getElementById('adminNavBtn');
                if(user.username === 'admin' && adminBtn) adminBtn.style.display = 'inline-block';
            } catch(e) { localStorage.removeItem('user'); window.location.href = '/login'; }
            
            document.getElementById('authLink').onclick = function(e) {
                e.preventDefault();
                localStorage.removeItem('user');
                fetch(`${API_URL}/logout`, { method: 'POST', credentials: 'include' }).finally(() => { window.location.href = '/login'; });
            };
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-menu button').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btn.classList.add('active');
        }

        async function loadBookings() {
            const response = await fetch(`${API_URL}/my-bookings`, { credentials: 'include' });
            if (response.status === 401) { localStorage.removeItem('user'); window.location.href = '/login'; return; }
            currentUserBookings = await response.json();
            
            const container = document.getElementById('bookingsContainer');
            container.innerHTML = '';

            if (currentUserBookings.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: var(--text-muted);" data-i18n="no_bookings">You don't have any bookings yet.</p>`;
                if(currentLang !== 'en') document.querySelector('[data-i18n="no_bookings"]').textContent = "እስካሁን ምንም ቦታ አላስያዙም።";
                return;
            }

            currentUserBookings.forEach(booking => {
                const statusClass = booking.status === 'confirmed' ? 'status-confirmed' : 'status-cancelled';
                
                const reviewBtn = booking.status === 'confirmed' ? 
                    `<button onclick="showReviewForm(${booking.id})" class="btn btn-primary btn-small" style="margin-top: 10px;"><i class="fa-solid fa-star"></i> ${translations[currentLang].leave_review}</button>` : '';

                const item = document.createElement('div');
                item.className = 'booking-item';
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap;">
                        <div>
                            <h3 style="color: var(--card-title);">Room ${booking.room_number} (${booking.room_type})</h3>
                            <p style="font-size: 14px; margin-top: 5px;"><strong>Guest:</strong> ${booking.guest_name}</p>
                            <p style="font-size: 14px;"><strong>Dates:</strong> ${booking.check_in} to ${booking.check_out}</p>
                            <p style="font-size: 14px;"><strong>Total:</strong> ${booking.total_price.toLocaleString()} ETB</p>
                            
                            <div class="review-form" id="reviewForm-${booking.id}" style="display: none;">
                                <h4 style="margin-bottom: 10px; color: var(--card-title);">Rate your stay</h4>
                                <div class="form-group">
                                    <select id="rating-${booking.id}" style="width: 100%; padding: 8px; margin-bottom: 10px;">
                                        <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                                        <option value="4">⭐⭐⭐⭐ (4/5)</option>
                                        <option value="3">⭐⭐⭐ (3/5)</option>
                                        <option value="2">⭐⭐ (2/5)</option>
                                        <option value="1">⭐ (1/5)</option>
                                    </select>
                                    <textarea id="comment-${booking.id}" placeholder="Tell us about your stay..." rows="2" style="width: 100%; padding: 8px; margin-bottom: 10px;"></textarea>
                                    <button onclick="submitReview(${booking.id}, ${booking.room_id})" class="btn btn-gold btn-small" style="width: 100%;">Submit Review</button>
                                </div>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <span class="booking-status ${statusClass}">${booking.status.toUpperCase()}</span><br>
                            ${booking.status === 'confirmed' ? `<button onclick="cancelBooking(${booking.id})" class="btn btn-danger btn-small" style="margin-top: 10px;"><i class="fa-solid fa-xmark"></i> ${translations[currentLang].cancel}</button>` : ''}
                            <br>${reviewBtn}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function showReviewForm(bookingId) {
            const form = document.getElementById(`reviewForm-${bookingId}`);
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        async function submitReview(bookingId, roomId) {
            const rating = document.getElementById(`rating-${bookingId}`).value;
            const comment = document.getElementById(`comment-${bookingId}`).value;
            const res = await fetch(`${API_URL}/reviews`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                body: JSON.stringify({ room_id: roomId, rating: parseInt(rating), comment: comment })
            });
            const data = await res.json();
            if (res.ok) { showToast('✅ Review submitted!', true); document.getElementById(`reviewForm-${bookingId}`).style.display = 'none'; }
            else { showToast(`❌ ${data.error}`, false); }
        }

        async function loadProfile() {
            const response = await fetch(`${API_URL}/profile`, { credentials: 'include' });
            if (response.ok) {
                const data = await response.json();
                document.getElementById('profileEmail').value = data.email || '';
                document.getElementById('profilePhone').value = data.phone || '';
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch(`${API_URL}/profile`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                body: JSON.stringify({ email: document.getElementById('profileEmail').value, phone: document.getElementById('profilePhone').value })
            });
            if (res.ok) showToast('✅ Profile updated!', true);
        });

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch(`${API_URL}/change-password`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                body: JSON.stringify({ current_password: document.getElementById('currentPassword').value, new_password: document.getElementById('newPassword').value })
            });
            const data = await res.json();
            if (res.ok) { showToast('✅ Password changed!', true); document.getElementById('passwordForm').reset(); }
            else { showToast(`❌ ${data.error}`, false); }
        });

        async function cancelBooking(id) {
            if (!confirm('Are you sure you want to cancel this booking?')) return;
            const res = await fetch(`${API_URL}/bookings/${id}/cancel`, { method: 'POST', credentials: 'include' });
            if (res.ok) { showToast('✅ Booking cancelled.', true); loadBookings(); }
        }

        checkAuth();
        loadBookings();
        loadProfile(); 
    </script>
</body>
</html>
