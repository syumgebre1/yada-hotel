<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - My Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-top: 20px; }
        .sidebar { background: var(--card-bg); border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: fit-content; }
        .sidebar-menu { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu button { width: 100%; text-align: left; padding: 12px 15px; border: none; background: transparent; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; color: var(--text-color); cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .sidebar-menu button.active { background: #1a3a5c; color: white; }
        .dashboard-content { background: var(--card-bg); border-radius: 15px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><img src="{{ url_for('static', filename='logo.png') }}" alt="YADA HOTEL" style="height: 45px; width: auto;"></a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/restaurant">Restaurant</a>
            <a href="/gallery">Gallery</a>
            <a href="/dashboard">Dashboard</a>
            <a href="#" id="authLink">Logout</a>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="padding: 30px 20px; margin-bottom: 10px;">
            <h1 style="font-size: 32px;">Welcome back, <span id="usernameDisplay">Guest</span>!</h1>
        </div>

        <div class="dashboard-layout">
            <div class="sidebar">
                <ul class="sidebar-menu">
                    <li><button class="active" onclick="switchTab('bookings', this)"><i class="fa-solid fa-calendar-days"></i> Room Bookings</button></li>
                    <li><button onclick="switchTab('foodorders', this)"><i class="fa-solid fa-utensils"></i> Food Orders</button></li>
                    <li><button onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i> Profile Settings</button></li>
                    <li><button onclick="switchTab('security', this)"><i class="fa-solid fa-lock"></i> Security</button></li>
                </ul>
            </div>

            <div class="dashboard-content">
                <div id="tab-bookings" class="tab-section active">
                    <h2 style="margin-bottom: 20px;">📅 My Room Bookings</h2>
                    <div id="bookingsContainer"></div>
                </div>

                <div id="tab-foodorders" class="tab-section">
                    <h2 style="margin-bottom: 20px;">🍔 My Food Orders</h2>
                    <div id="foodOrdersContainer">
                        <p style="text-align: center; color: var(--text-muted);">Loading...</p>
                    </div>
                </div>

                <div id="tab-profile" class="tab-section">
                    <h2 style="margin-bottom: 20px;">👤 Update Profile</h2>
                    <form id="profileForm" style="max-width: 500px;">
                        <div class="form-group"><label>Email Address</label><input type="email" id="profileEmail" required></div>
                        <div class="form-group"><label>Phone Number</label><input type="tel" id="profilePhone"></div>
                        <button type="submit" class="btn btn-gold" style="width: 100%;">Save Profile</button>
                    </form>
                </div>

                <div id="tab-security" class="tab-section">
                    <h2 style="margin-bottom: 20px;">🔒 Change Password</h2>
                    <form id="passwordForm" style="max-width: 500px;">
                        <div class="form-group"><label>Current Password</label><input type="password" id="currentPassword" required></div>
                        <div class="form-group"><label>New Password</label><input type="password" id="newPassword" required></div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        // ... Existing JS logic for auth, bookings, profile ...

        // NEW: Load Food Orders
        async function loadMyFoodOrders() {
            const res = await fetch(`${API_URL}/my-food-orders`, { credentials: 'include' });
            const orders = await res.json();
            const container = document.getElementById('foodOrdersContainer');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align:center;">You have no food orders yet.</p>';
                return;
            }

            orders.forEach(o => {
                const itemsParsed = JSON.parse(o.items).map(i => `${i.qty}x ${i.name}`).join(', ');
                container.innerHTML += `
                    <div class="booking-item" style="border-bottom: 1px solid var(--border-color); padding: 15px 0; display:flex; justify-content:space-between;">
                        <div>
                            <h4>Order #${o.id}</h4>
                            <p style="font-size: 14px;">${itemsParsed}</p>
                            <p style="font-size: 12px; color: var(--text-muted);">${o.date}</p>
                        </div>
                        <div style="text-align: right;">
                            <span class="booking-status badge-${o.status}">${o.status.toUpperCase()}</span><br>
                            <strong>${o.total} ETB</strong><br>
                            <a href="/api/food-orders/${o.id}/receipt" target="_blank" class="btn btn-gold btn-small" style="margin-top: 10px;"><i class="fa-solid fa-file-invoice"></i> Receipt</a>
                        </div>
                    </div>
                `;
            });
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.sidebar-menu button').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            btn.classList.add('active');

            if (tabName === 'foodorders') loadMyFoodOrders(); // NEW
        }

        // ... Call functions on load ...
    </script>
</body>
</html>
