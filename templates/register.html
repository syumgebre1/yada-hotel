<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <!-- ABSOLUTE PATH USED HERE -->
            <img src="/static/logo.png" alt="YADA HOTEL" style="height: 45px; width: auto; object-fit: contain;">
        </a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/login">Login</a>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>
    <div class="container">
        <div style="max-width: 400px; margin: 40px auto;">
            <div class="card">
                <h2 style="text-align: center; color: var(--card-title); margin-bottom: 20px;"><i class="fa-solid fa-user-plus"></i> Create an Account</h2>
                <form id="registerForm">
                    <div class="form-group"><label for="username">Username</label><input type="text" id="username" required></div>
                    <div class="form-group"><label for="email">Email</label><input type="email" id="email" required></div>
                    <div class="form-group"><label for="password">Password</label><input type="password" id="password" required></div>
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px;">Register</button>
                </form>
                <p style="text-align: center; margin-top: 15px;">Already have an account? <a href="/login" style="color: #2a5a8a;">Login here</a></p>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark-mode"); }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }
        function showToast(message, isSuccess = true) {
            Toastify({ text: message, duration: 3000, close: true, gravity: "top", position: "right", style: { background: isSuccess ? "linear-gradient(to right, #00b09b, #96c93d)" : "linear-gradient(to right, #ff5f6d, #ffc371)" } }).showToast();
        }
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, email, password }) });
                const data = await response.json();
                if (response.ok) { showToast('✅ Registration successful! Redirecting...', true); setTimeout(() => { window.location.href = '/login'; }, 1500); }
                else { showToast(`❌ ${data.error}`, false); }
            } catch (error) { showToast('❌ Connection error.', false); }
        });
    </script>
</body>
</html>
