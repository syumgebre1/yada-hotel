<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Restaurant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-top: 20px; }
        .menu-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: transform 0.3s; display: flex; flex-direction: column; }
        .menu-card:hover { transform: translateY(-5px); }
        .menu-card img { width: 100%; height: 200px; object-fit: cover; }
        .menu-card .content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .menu-card .category { font-size: 12px; color: #e6b800; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .menu-card h3 { margin: 10px 0; color: var(--card-title); font-family: 'Playfair Display', serif; font-size: 22px; }
        .menu-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; flex-grow: 1; }
        .menu-card .price { font-size: 22px; font-weight: 700; color: #2a5a8a; margin-top: auto; }
        .special-badge { background: #e74c3c; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; width: fit-content; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--card-title); margin: 40px 0 20px 0; border-bottom: 2px solid #e6b800; padding-bottom: 10px; }
        .special-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin: 0 auto; max-width: 800px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><i class="fa-solid fa-hotel"></i> YADA HOTEL</a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/restaurant">Restaurant</a>
            <a href="/contact">Contact Us</a>
            <a href="/login" id="authLink">Login</a>
            <button class="nav-theme-toggle" id="themeBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="padding: 60px 20px; text-align: center; background: linear-gradient(rgba(26, 58, 92, 0.8), rgba(26, 58, 92, 0.9)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;">
            <h1 style="font-family: 'Playfair Display', serif; font-size: 48px; color: white; margin-bottom: 10px;"><i class="fa-solid fa-utensils"></i> YADA Restaurant</h1>
            <p style="color: #e6b800; font-size: 20px;">Delicious meals prepared with love. Experience the taste of Ethiopia.</p>
        </div>

        <!-- Today's Special Section -->
        <div id="specialSection" style="display: none; text-align: center; margin-bottom: 40px;">
            <h2 class="section-title" style="border: none; margin-bottom: 20px;"><i class="fa-solid fa-fire" style="color: #e74c3c;"></i> Today's Special</h2>
            <div id="specialContainer" class="special-container"></div>
        </div>

        <!-- Full Menu Section -->
        <div id="menuContainer"></div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        if (localStorage.getItem("theme") === "dark") { document.body.classList.add("dark-mode"); }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
            const icon = document.querySelector("#themeBtn i");
            if(icon) icon.className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }
        window.addEventListener("DOMContentLoaded", () => {
            const icon = document.querySelector("#themeBtn i");
            if(icon && document.body.classList.contains("dark-mode")) icon.className = "fa-solid fa-sun";
        });

        async function loadMenu() {
            try {
                const res = await fetch('/api/menu');
                const items = await res.json();

                if (items.length === 0) {
                    document.getElementById('menuContainer').innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size: 18px; margin-top: 40px;">Our menu is being updated. Please check back later!</p>';
                    return;
                }
                
                const specials = items.filter(i => i.is_special);
                const regular = items.filter(i => !i.is_special);

                // Render Specials
                if (specials.length > 0) {
                    document.getElementById('specialSection').style.display = 'block';
                    const sContainer = document.getElementById('specialContainer');
                    specials.forEach(item => {
                        const img = item.image_filename ? `/static/uploads/${item.image_filename}` : 'https://via.placeholder.com/400x200?text=Food+Image';
                        sContainer.innerHTML += `
                            <div class="menu-card" style="border: 2px solid #e74c3c;">
                                <img src="${img}" onerror="this.src='https://via.placeholder.com/400x200?text=Food+Image'">
                                <div class="content">
                                    <span class="special-badge">TODAY'S SPECIAL</span>
                                    <h3>${item.name}</h3>
                                    <p>${item.description || ''}</p>
                                    <div class="price">${item.price.toLocaleString()} ETB</div>
                                </div>
                            </div>
                        `;
                    });
                }

                // Group Regular Items by Category
                const categories = [...new Set(regular.map(i => i.category))];
                const container = document.getElementById('menuContainer');
                container.innerHTML = '';
                
                categories.forEach(category => {
                    const categoryItems = regular.filter(i => i.category === category);
                    container.innerHTML += `<h2 class="section-title">${category}</h2>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'menu-grid';
                    
                    categoryItems.forEach(item => {
                        const img = item.image_filename ? `/static/uploads/${item.image_filename}` : 'https://via.placeholder.com/400x200?text=Food+Image';
                        grid.innerHTML += `
                            <div class="menu-card">
                                <img src="${img}" onerror="this.src='https://via.placeholder.com/400x200?text=Food+Image'">
                                <div class="content">
                                    <span class="category">${item.category}</span>
                                    <h3>${item.name}</h3>
                                    <p>${item.description || ''}</p>
                                    <div class="price">${item.price.toLocaleString()} ETB</div>
                                </div>
                            </div>
                        `;
                    });
                    container.appendChild(grid);
                });

            } catch(e) { 
                console.error("Error loading menu:", e); 
                document.getElementById('menuContainer').innerHTML = '<p style="text-align:center; color:red;">Failed to load menu. Check server connection.</p>';
            }
        }

        loadMenu();
    </script>
</body>
</html>
