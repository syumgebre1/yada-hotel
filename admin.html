<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Admin Panel</title>
    <link rel="stylesheet" href="J.css/style.css">
    <style>
        /* Admin Styles */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .admin-header h1 {
            font-family: 'Playfair Display', serif;
            color: #1a3a5c;
            font-size: 32px;
        }
        .admin-header .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .admin-header .logout-btn:hover {
            background: #c0392b;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-left: 4px solid #2a5a8a;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: #2a5a8a;
        }
        .stat-card .label {
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 500;
        }
        .stat-card.revenue { border-left-color: #27ae60; }
        .stat-card.booking { border-left-color: #f39c12; }
        .stat-card.guest { border-left-color: #8e44ad; }
        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: #eef2f7;
            color: #1a3a5c;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn:hover {
            background: #2a5a8a;
            color: white;
        }
        .tab-btn.active {
            background: #2a5a8a;
            color: white;
        }
        .tab-content {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .tab-content.active {
            display: block;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #1a3a5c;
            color: white;
        }
        tr:hover {
            background: #f5f8fa;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-confirmed { background: #d4edda; color: #155724; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-cancelled { background: #f8d7da; color: #721c24; }
        .badge-available { background: #d4edda; color: #155724; }
        .badge-occupied { background: #f8d7da; color: #721c24; }
        .btn-sm {
            padding: 5px 15px;
            font-size: 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            margin: 2px;
        }
        .btn-edit { background: #2a5a8a; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-add {
            background: #27ae60;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .btn-add:hover { background: #219a52; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h3 { margin-bottom: 20px; }
        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .admin-header { flex-direction: column; text-align: center; gap: 15px; }
            .tab-bar { flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="admin.html" style="background: #2a5a8a; color: white; border-radius: 25px;">👨‍💼 Admin</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>👨‍💼 Admin Dashboard</h1>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="number" id="totalRooms">-</div><div class="label">Total Rooms</div></div>
            <div class="stat-card"><div class="number" id="availableRooms">-</div><div class="label">Available</div></div>
            <div class="stat-card booking"><div class="number" id="totalBookings">-</div><div class="label">Total Bookings</div></div>
            <div class="stat-card revenue"><div class="number" id="totalRevenue">-</div><div class="label">Revenue (ETB)</div></div>
            <div class="stat-card guest"><div class="number" id="totalGuests">-</div><div class="label">Total Guests</div></div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('rooms')">🛏️ Rooms</button>
            <button class="tab-btn" onclick="switchTab('bookings')">📅 Bookings</button>
            <button class="tab-btn" onclick="switchTab('guests')">👤 Guests</button>
        </div>

        <!-- Rooms Tab -->
        <div class="tab-content active" id="tab-rooms">
            <button class="btn-add" onclick="openAddRoom()">➕ Add New Room</button>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Room</th><th>Type</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="roomsTableBody"><tr><td colspan="5">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Bookings Tab -->
        <div class="tab-content" id="tab-bookings">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Room</th><th>Guest</th><th>Check-in</th><th>Check-out</th><th>Total</th><th>Status</th></tr></thead>
                    <tbody id="bookingsTableBody"><tr><td colspan="7">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Guests Tab -->
        <div class="tab-content" id="tab-guests">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Registered</th><th>Bookings</th></tr></thead>
                    <tbody id="guestsTableBody"><tr><td colspan="5">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Room Modal -->
    <div class="modal" id="addRoomModal">
        <div class="modal-content">
            <h3>➕ Add New Room</h3>
            <form id="addRoomForm">
                <input type="text" id="roomNumber" placeholder="Room Number (e.g., 114)" required>
                <select id="roomType" required>
                    <option value="Standard">Standard</option>
                    <option value="Deluxe">Deluxe</option>
                    <option value="Suite">Suite</option>
                </select>
                <input type="number" id="roomPrice" placeholder="Price per night" required>
                <textarea id="roomDescription" placeholder="Description" rows="3"></textarea>
                <button type="submit" class="btn btn-blue" style="width:100%;">Add Room</button>
                <button type="button" class="btn btn-danger" onclick="closeModal('addRoomModal')" style="width:100%; margin-top:10px;">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';

        function checkAuth() {
            const user = localStorage.getItem('user');
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const userData = JSON.parse(user);
                if (userData.username !== 'admin') {
                    alert('Admin access required!');
                    window.location.href = 'dashboard.html';
                }
            } catch(e) {
                window.location.href = 'login.html';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`, { credentials: 'include' });
                if (response.status === 403) {
                    alert('Admin access required');
                    window.location.href = 'login.html';
                    return;
                }
                if (!response.ok) throw new Error('Failed');
                const stats = await response.json();
                document.getElementById('totalRooms').textContent = stats.total_rooms || 0;
                document.getElementById('availableRooms').textContent = stats.available_rooms || 0;
                document.getElementById('totalBookings').textContent = stats.total_bookings || 0;
                document.getElementById('totalRevenue').textContent = (stats.total_revenue || 0).toLocaleString();
                document.getElementById('totalGuests').textContent = stats.total_guests || 0;
            } catch (e) { console.error(e); }
        }

        async function loadRooms() {
            try {
                const response = await fetch(`${API_URL}/rooms`);
                const rooms = await response.json();
                const tbody = document.getElementById('roomsTableBody');
                tbody.innerHTML = '';
                rooms.forEach(r => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${r.room_number}</td>
                            <td>${r.room_type}</td>
                            <td>${r.price.toLocaleString()} ETB</td>
                            <td><span class="badge ${r.available ? 'badge-available' : 'badge-occupied'}">${r.available ? 'Available' : 'Occupied'}</span></td>
                            <td>
                                <button class="btn-sm btn-edit" onclick="editRoom(${r.id})">✏️</button>
                                <button class="btn-sm btn-delete" onclick="deleteRoom(${r.id})">🗑️</button>
                            </td>
                        </tr>`;
                });
            } catch(e) { console.error(e); }
        }

        async function loadBookings() {
            try {
                const response = await fetch(`${API_URL}/admin/bookings`, { credentials: 'include' });
                if (!response.ok) throw new Error('Failed');
                const bookings = await response.json();
                const tbody = document.getElementById('bookingsTableBody');
                tbody.innerHTML = '';
                bookings.forEach(b => {
                    tbody.innerHTML += `
                        <tr>
                            <td>#${b.id}</td>
                            <td>${b.room_number}</td>
                            <td>${b.guest_name}</td>
                            <td>${b.check_in}</td>
                            <td>${b.check_out}</td>
                            <td>${b.total_price.toLocaleString()} ETB</td>
                            <td><span class="badge badge-${b.status}">${b.status.toUpperCase()}</span></td>
                        </tr>`;
                });
            } catch(e) { console.error(e); }
        }

        async function loadGuests() {
            try {
                const response = await fetch(`${API_URL}/admin/guests`, { credentials: 'include' });
                if (!response.ok) throw new Error('Failed');
                const guests = await response.json();
                const tbody = document.getElementById('guestsTableBody');
                tbody.innerHTML = '';
                guests.forEach(g => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${g.id}</td>
                            <td>${g.username}</td>
                            <td>${g.email}</td>
                            <td>${g.created_at}</td>
                            <td>${g.total_bookings}</td>
                        </tr>`;
                });
            } catch(e) { console.error(e); }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
            if (tab === 'rooms') loadRooms();
            else if (tab === 'bookings') loadBookings();
            else if (tab === 'guests') loadGuests();
        }

        function openAddRoom() { document.getElementById('addRoomModal').classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        document.getElementById('addRoomForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch(`${API_URL}/admin/rooms`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        room_number: document.getElementById('roomNumber').value,
                        room_type: document.getElementById('roomType').value,
                        price: parseInt(document.getElementById('roomPrice').value),
                        description: document.getElementById('roomDescription').value
                    })
                });
                if (response.ok) {
                    alert('✅ Room added!');
                    closeModal('addRoomModal');
                    loadRooms(); loadStats();
                    document.getElementById('addRoomForm').reset();
                } else {
                    const data = await response.json();
                    alert('❌ ' + data.error);
                }
            } catch(e) { alert('❌ Connection error'); }
        });

        async function editRoom(id) {
            try {
                const response = await fetch(`${API_URL}/rooms/${id}`);
                const room = await response.json();
                const newPrice = prompt('New price for Room ' + room.room_number + ':', room.price);
                if (newPrice) {
                    const update = await fetch(`${API_URL}/admin/rooms/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ price: parseInt(newPrice) })
                    });
                    if (update.ok) { alert('✅ Updated!'); loadRooms(); loadStats(); }
                }
            } catch(e) { alert('❌ Error'); }
        }

        async function deleteRoom(id) {
            if (!confirm('Delete this room?')) return;
            try {
                const response = await fetch(`${API_URL}/admin/rooms/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (response.ok) { alert('✅ Deleted!'); loadRooms(); loadStats(); }
                else { const data = await response.json(); alert('❌ ' + data.error); }
            } catch(e) { alert('❌ Connection error'); }
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        document.getElementById('logoutLink').onclick = logout;
        document.getElementById('logoutBtn').onclick = logout;

        checkAuth();
        loadStats();
        loadRooms();
    </script>
</body>
</html>
