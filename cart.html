<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Cart</title>
    <link rel="stylesheet" href="J.css/style.css">
    <style>
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 2px solid #f0f0f0;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-total {
            font-size: 28px;
            font-weight: 700;
            color: #e6b800;
            text-align: right;
            padding: 20px 0;
        }
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        .empty-cart h3 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin-bottom: 15px;
            color: #1a1a2e;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-control button {
            padding: 5px 15px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        .btn-minus {
            background: #e74c3c;
            color: white;
        }
        .btn-plus {
            background: #2ecc71;
            color: white;
        }
        .cart-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .cart-actions .btn {
            flex: 1;
            text-align: center;
            min-width: 120px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" id="authLink">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="padding: 20px;">
            <h1 style="font-size: 32px;">🛒 Your Cart</h1>
        </div>
        <div id="cartItems"></div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        function checkAuth() {
            const user = localStorage.getItem('user');
            const authLink = document.getElementById('authLink');
            
            if (user) {
                authLink.textContent = 'Logout';
                authLink.href = '#';
                authLink.onclick = function(e) {
                    e.preventDefault();
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                };
            } else {
                authLink.textContent = 'Login';
                authLink.href = 'login.html';
                authLink.onclick = null;
            }
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h3>🛒 Empty Cart</h3>
                        <p>Your cart is empty. Add some delicious food or drinks!</p>
                        <br>
                        <a href="menu.html" class="btn btn-gold">Browse Menu</a>
                    </div>
                `;
                return;
            }

            let html = '<div class="card">';
            let total = 0;
            
            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                html += `
                    <div class="cart-item">
                        <div>
                            <span style="font-size: 30px;">${item.emoji}</span>
                            <strong>${item.name}</strong>
                            <span style="color: #7f8c8d; margin-left: 10px;">${item.price} ETB</span>
                        </div>
                        <div class="quantity-control">
                            <button class="btn-minus" onclick="updateQuantity(${index}, -1)">−</button>
                            <span style="font-size: 18px; min-width: 30px; text-align: center; font-weight: 600;">${item.quantity}</span>
                            <button class="btn-plus" onclick="updateQuantity(${index}, 1)">+</button>
                            <button onclick="removeItem(${index})" style="margin-left: 15px; background: #e74c3c; color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer;">✕</button>
                        </div>
                    </div>
                `;
            });

            html += `
                <div class="cart-total">💰 Total: ${total} ETB</div>
                <div class="cart-actions">
                    <a href="menu.html" class="btn btn-primary">Continue Shopping</a>
                    <button onclick="clearCart()" class="btn btn-danger">🗑️ Clear Cart</button>
                    <button onclick="placeOrder()" class="btn btn-gold" style="flex: 2;">✅ Place Order</button>
                </div>
            </div>`;
            
            container.innerHTML = html;
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function clearCart() {
            if (cart.length === 0) return;
            if (confirm('Are you sure you want to clear your cart?')) {
                cart = [];
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function placeOrder() {
            const user = localStorage.getItem('user');
            if (!user) {
                alert('Please login first!');
                window.location.href = 'login.html';
                return;
            }

            const orderText = cart.map(item => `${item.emoji} ${item.name} x ${item.quantity}`).join('\n');
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            alert(`📦 Order Placed!\n\n${orderText}\n\n💰 Total: ${total} ETB\n\nThank you for ordering at YADA Hotel!`);
            
            cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        checkAuth();
        renderCart();
    </script>
</body>
</html>
