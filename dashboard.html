<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Dashboard</title>
    <link rel="stylesheet" href="J.css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>👋 Welcome, <span id="userName">Guest</span>!</h2>
            <p>Here are your bookings and account details.</p>
        </div>

        <div id="alertMessage"></div>

        <div class="card">
            <h3>📋 My Bookings</h3>
            <div id="bookingsContainer">
                <p>Loading your bookings...</p>
            </div>
        </div>

        <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px;">
            <a href="rooms.html" class="btn btn-gold">🛏️ Book a Room</a>
            <a href="menu.html" class="btn btn-primary">🍽️ Order Food</a>
            <a href="#" class="btn btn-danger" id="logoutBtn">🚪 Logout</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';
        
        function checkAuth() {
            const user = localStorage.getItem('user');
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const userData = JSON.parse(user);
                document.getElementById('userName').textContent = userData.username || 'Guest';
            } catch (e) {
                console.error('Error parsing user data:', e);
                window.location.href = 'login.html';
            }
        }
        
        async function loadBookings() {
            const container = document.getElementById('bookingsContainer');
            container.innerHTML = '<p>⏳ Loading your bookings...</p>';
            
            try {
                const user = localStorage.getItem('user');
                if (!user) {
                    container.innerHTML = '<p style="color: #e74c3c;">❌ Please login first.</p>';
                    return;
                }
                
                console.log('📡 Fetching bookings from:', API_URL + '/my-bookings');
                
                const response = await fetch(`${API_URL}/my-bookings`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('📊 Response status:', response.status);
                
                if (response.status === 401) {
                    localStorage.removeItem('user');
                    container.innerHTML = '<p style="color: #e74c3c;">❌ Session expired. Please <a href="login.html">login again</a>.</p>';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const bookings = await response.json();
                console.log('📋 Bookings:', bookings);
                
                if (!bookings || bookings.length === 0) {
                    container.innerHTML = '<p style="color: #7f8c8d;">📭 You have no bookings yet. <a href="rooms.html">Book a room now!</a></p>';
                    return;
                }
                
                let html = '';
                bookings.forEach(booking => {
                    const statusClass = `status-${booking.status}`;
                    const statusText = booking.status.toUpperCase();
                    html += `
                        <div class="booking-item">
                            <p><strong>🛏️ Room:</strong> ${booking.room_number} (${booking.room_type})</p>
                            <p><strong>👤 Guest:</strong> ${booking.guest_name}</p>
                            <p><strong>📅 Check-in:</strong> ${booking.check_in} | <strong>Check-out:</strong> ${booking.check_out}</p>
                            <p><strong>💰 Total:</strong> <span style="color: #e6b800; font-weight: bold; font-size: 18px;">${booking.total_price.toLocaleString()} ETB</span></p>
                            <p><span class="booking-status ${statusClass}">${statusText}</span></p>
                            ${booking.status === 'confirmed' ? 
                                `<button onclick="cancelBooking(${booking.id})" class="btn btn-danger" style="margin-top: 10px;">❌ Cancel Booking</button>` : 
                                ''
                            }
                            <hr>
                        </div>
                    `;
                });
                container.innerHTML = html;
                
            } catch (error) {
                console.error('❌ Error loading bookings:', error);
                container.innerHTML = `
                    <p style="color: #e74c3c;">❌ Failed to fetch</p>
                    <p style="color: #7f8c8d; font-size: 14px; margin-top: 10px;">Make sure the backend is running in Termux.</p>
                    <button onclick="location.reload()" class="btn btn-primary" style="margin-top: 15px;">🔄 Retry</button>
                `;
            }
        }
        
        async function cancelBooking(bookingId) {
            if (!confirm('Are you sure you want to cancel this booking?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/bookings/${bookingId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert('✅ Booking cancelled successfully!', 'success');
                    loadBookings();
                } else {
                    showAlert(data.error || '❌ Failed to cancel booking', 'error');
                }
            } catch (error) {
                showAlert('❌ Connection error', 'error');
                console.error('Error:', error);
            }
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }
        
        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }
        
        document.getElementById('logoutLink').addEventListener('click', function(e) {
            e.preventDefault();
            logout();
        });
        
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            logout();
        });
        
        checkAuth();
        loadBookings();
    </script>
</body>
</html>
