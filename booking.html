<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Book a Room</title>
    <link rel="stylesheet" href="J.css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div style="max-width: 600px; margin: 0 auto;">
            <div class="card">
                <h2 style="text-align: center; color: #1a1a2e;">📝 Book a Room</h2>
                <p style="text-align: center; color: #666;" id="roomInfo">Loading room details...</p>
                
                <div id="alertMessage"></div>
                
                <form id="bookingForm">
                    <div class="form-group">
                        <label for="guestName">Guest Full Name</label>
                        <input type="text" id="guestName" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="guestPhone">Phone Number</label>
                        <input type="tel" id="guestPhone" placeholder="Enter your phone number">
                    </div>
                    
                    <div class="form-group">
                        <label for="checkIn">Check-in Date</label>
                        <input type="date" id="checkIn" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="checkOut">Check-out Date</label>
                        <input type="date" id="checkOut" required>
                    </div>
                    
                    <div id="priceSummary" style="background: #f4f4f4; padding: 15px; border-radius: 5px; margin: 15px 0;">
                        <p><strong>Room Type:</strong> <span id="displayRoomType">-</span></p>
                        <p><strong>Price per night:</strong> <span id="displayPrice">-</span> ETB</p>
                        <p><strong>Nights:</strong> <span id="displayNights">0</span></p>
                        <p style="font-size: 20px; color: #e6b800;"><strong>Total:</strong> <span id="displayTotal">0</span> ETB</p>
                    </div>
                    
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px;">
                        Confirm Booking
                    </button>
                </form>
                
                <p style="text-align: center; margin-top: 15px;">
                    <a href="rooms.html">← Back to Rooms</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // ⭐⭐⭐ USING 127.0.0.1 ⭐⭐⭐
        const API_URL = 'http://127.0.0.1:5000/api';
        
        function checkAuth() {
            const user = localStorage.getItem('user');
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('logoutLink').addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            });
        }
        
        function getRoomId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('room_id');
        }
        
        async function loadRoomDetails() {
            const roomId = getRoomId();
            
            if (!roomId) {
                document.getElementById('roomInfo').textContent = '❌ No room selected';
                document.getElementById('roomInfo').style.color = 'red';
                return;
            }
            
            try {
                console.log('📡 Fetching room:', API_URL + '/rooms/' + roomId);
                
                const response = await fetch(`${API_URL}/rooms/${roomId}`);
                
                console.log('📊 Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error('Room not found');
                }
                
                const room = await response.json();
                console.log('📋 Room data:', room);
                
                document.getElementById('roomInfo').textContent = `Room ${room.room_number} - ${room.room_type}`;
                document.getElementById('displayRoomType').textContent = room.room_type;
                document.getElementById('displayPrice').textContent = room.price;
                
                document.getElementById('bookingForm').dataset.roomId = room.id;
                document.getElementById('bookingForm').dataset.price = room.price;
                
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert('Failed to load room details. Make sure backend is running.', 'error');
                document.getElementById('roomInfo').textContent = '❌ Error loading room';
                document.getElementById('roomInfo').style.color = 'red';
            }
        }
        
        function calculateTotal() {
            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;
            const price = parseInt(document.getElementById('bookingForm').dataset.price || 0);
            
            if (checkIn && checkOut && price > 0) {
                const start = new Date(checkIn);
                const end = new Date(checkOut);
                const nights = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                
                if (nights > 0) {
                    document.getElementById('displayNights').textContent = nights;
                    document.getElementById('displayTotal').textContent = (nights * price).toLocaleString();
                    return nights;
                }
            }
            
            document.getElementById('displayNights').textContent = '0';
            document.getElementById('displayTotal').textContent = '0';
            return 0;
        }
        
        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const user = localStorage.getItem('user');
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            const roomId = document.getElementById('bookingForm').dataset.roomId;
            const guestName = document.getElementById('guestName').value.trim();
            const guestPhone = document.getElementById('guestPhone').value.trim();
            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;
            
            if (!guestName) {
                showAlert('Please enter your full name', 'error');
                return;
            }
            
            if (!checkIn || !checkOut) {
                showAlert('Please select check-in and check-out dates', 'error');
                return;
            }
            
            const nights = calculateTotal();
            if (nights <= 0) {
                showAlert('Check-out must be after check-in', 'error');
                return;
            }
            
            try {
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Processing...';
                submitBtn.disabled = true;
                
                console.log('📡 Sending booking:', {
                    room_id: parseInt(roomId),
                    guest_name: guestName,
                    guest_phone: guestPhone,
                    check_in: checkIn,
                    check_out: checkOut
                });
                
                const response = await fetch(`${API_URL}/bookings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        room_id: parseInt(roomId),
                        guest_name: guestName,
                        guest_phone: guestPhone,
                        check_in: checkIn,
                        check_out: checkOut
                    })
                });
                
                const data = await response.json();
                console.log('📊 Response:', response.status, data);
                
                if (response.ok) {
                    showAlert(`✅ Booking confirmed! Total: ${data.total_price} ETB for ${data.nights} nights`, 'success');
                    
                    setTimeout(function() {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Booking failed', 'error');
                    submitBtn.textContent = 'Confirm Booking';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert('Connection error. Make sure the server is running.', 'error');
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Confirm Booking';
                submitBtn.disabled = false;
            }
        });
        
        document.getElementById('checkIn').addEventListener('change', calculateTotal);
        document.getElementById('checkOut').addEventListener('change', calculateTotal);
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(function() {
                alertDiv.style.display = 'none';
            }, 5000);
        }
        
        checkAuth();
        loadRoomDetails();
        
        // Set default dates
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        document.getElementById('checkIn').value = today.toISOString().split('T')[0];
        document.getElementById('checkOut').value = tomorrow.toISOString().split('T')[0];
        
        setTimeout(calculateTotal, 100);
    </script>
</body>
</html>
