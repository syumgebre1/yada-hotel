<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADA HOTEL - Login</title>
    <link rel="stylesheet" href="J.css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">🏨 YADA HOTEL</a>
        <div class="navbar-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Rooms</a>
            <a href="menu.html">Menu</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="container">
        <div style="max-width: 400px; margin: 40px auto;">
            <div class="card">
                <h2 style="text-align: center; color: #1a1a2e;">🔐 Login</h2>
                
                <div id="alertMessage"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 12px;">
                        Login
                    </button>
                </form>
                
                <p style="text-align: center; margin-top: 15px;">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // ⭐⭐⭐ USING YOUR IP ADDRESS ⭐⭐⭐
        const API_URL = 'http://127.0.0.1:5000/api';
        
        function checkAlreadyLoggedIn() {
            const user = localStorage.getItem('user');
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    if (userData.username) {
                        window.location.href = 'dashboard.html';
                        return true;
                    }
                } catch(e) {
                    localStorage.removeItem('user');
                }
            }
            return false;
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showAlert('Please enter username and password', 'error');
                return;
            }
            
            try {
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Logging in...';
                submitBtn.disabled = true;
                
                console.log('📡 Sending login to:', API_URL + '/login');
                
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                console.log('📊 Response:', response.status, data);
                
                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showAlert('✅ Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showAlert(data.error || '❌ Login failed', 'error');
                    submitBtn.textContent = 'Login';
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error('❌ Error:', error);
                showAlert('❌ Connection error. Make sure the server is running on port 5000', 'error');
                const submitBtn = document.querySelector('button[type="submit"]');
                submitBtn.textContent = 'Login';
                submitBtn.disabled = false;
            }
        });
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }
        
        checkAlreadyLoggedIn();
    </script>
</body>
</html>
